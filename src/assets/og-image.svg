<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="'Geist Mono', ui-monospace, monospace">
  <!-- Background: zinc-950 -->
  <rect width="1200" height="630" fill="#09090B"/>

  <!-- Subtle 1px grid frame, zinc-800 -->
  <rect x="48" y="48" width="1104" height="534" fill="none" stroke="#27272A" stroke-width="1"/>

  <!-- Top-left system label, mono caps, zinc-500 -->
  <text x="80" y="112" font-size="18" letter-spacing="3" fill="#71717A" font-weight="500">FIRECRACKER MICROVM ORCHESTRATOR</text>

  <!-- Lockup: solid amber square + bracketed wordmark, baseline-aligned -->
  <g transform="translate(80, 240)">
    <rect x="0" y="0" width="96" height="96" fill="#F97316"/>
    <text x="128" y="80" font-size="96" font-weight="600">
      <tspan fill="#F97316">[</tspan><tspan fill="#FAFAFA">bhatti</tspan><tspan fill="#F97316">]</tspan>
    </text>
  </g>

  <!-- Tagline, sans-serif, zinc-300 -->
  <text x="80" y="430" font-family="'Geist', -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="40" font-weight="400" fill="#D4D4D8" letter-spacing="-1">
    Own your metal. Real Linux VMs that
  </text>
  <text x="80" y="482" font-family="'Geist', -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="40" font-weight="400" fill="#D4D4D8" letter-spacing="-1">
    manage themselves.
  </text>

  <!-- Bottom row: prompt + url -->
  <text x="80" y="554" font-size="20" fill="#A1A1AA">
    <tspan fill="#F97316">$</tspan> curl -fsSL bhatti.sh/install | sudo bash
  </text>
  <text x="1120" y="554" font-size="20" fill="#71717A" text-anchor="end">bhatti.sh</text>
</svg>
